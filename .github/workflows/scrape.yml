name: Scrape HK Bank Promos

on:
  schedule:
    # 每日香港時間 08:00（UTC 00:00）
    - cron: "0 0 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [scrape]

permissions:
  contents: write
  actions: read

concurrency:
  group: scrape-hk-promos
  cancel-in-progress: false

jobs:
  scrape:
    name: Playwright scrape + AI parse
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      AI_MODEL: ${{ secrets.AI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      TZ: Asia/Hong_Kong
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Chromium (no Firefox/WebKit)
        run: npx playwright install --with-deps chromium

      - name: Run scraper + AI parser
        run: node scripts/scraper.js

      - name: Commit & push data.json + index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html
          if git diff --staged --quiet; then
            echo "No promotion data changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh HK bank promotions ($(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M HKT'))"
          git pull --rebase origin "${GITHUB_REF_NAME}" || git pull --rebase origin HEAD
          git push
